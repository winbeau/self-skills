name: release-skills

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (empty = build artifacts only)"
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-skills-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skill layout
        run: python3 scripts/validate_skills.py

      - name: Resolve version label
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Package skills as chat-importable zips
        run: |
          python3 scripts/package_skills.py \
            --out dist \
            --bundle self-skills-all \
            --version "${{ steps.version.outputs.value }}" \
            --notes "${RUNNER_TEMP}/RELEASE_NOTES.md"

      - name: Verify every archive carries a SKILL.md
        run: |
          set -euo pipefail
          for archive in dist/*.zip; do
            python3 - "$archive" <<'PY'
          import sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          if not any(name.count("/") == 1 and name.endswith("SKILL.md") for name in names):
              sys.exit(f"{path}: no <skill>/SKILL.md entry")
          print(f"{path}: OK ({len(names)} files)")
          PY
          done
          cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: skill-zips-${{ steps.version.outputs.value }}
          path: dist
          retention-days: 14

      - name: Publish GitHub Release
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '') || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.value }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "${PRERELEASE:-false}" = "true" ]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file "${RUNNER_TEMP}/RELEASE_NOTES.md" "${flags[@]}"
          else
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt \
              --title "Agent Skills $TAG" \
              --notes-file "${RUNNER_TEMP}/RELEASE_NOTES.md" \
              --target "$GITHUB_SHA" "${flags[@]}"
          fi
